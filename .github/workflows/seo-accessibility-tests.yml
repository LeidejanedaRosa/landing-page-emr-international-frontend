name: SEO & Accessibility Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  seo-accessibility-tests:
    name: Run SEO & Accessibility Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build application
        run: npm run build

      - name: Start preview server
        run: npm run preview &
        env:
          CI: true

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:4173 --timeout 30000

      - name: Run SEO Metadata Tests
        run: npm run test:seo:metadata
        continue-on-error: false

      - name: Run Semantic HTML Tests
        run: npm run test:seo:semantic
        continue-on-error: false

      - name: Run Accessibility Tests
        run: npm run test:seo:a11y
        continue-on-error: false

      - name: Run Performance & Keywords Tests
        run: npm run test:seo:performance
        continue-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'playwright-report/index.html';

            let comment = '## 🔍 SEO & Accessibility Test Results\n\n';
            comment += '### Test Suites:\n';
            comment += '- ✅ SEO Metadata Tests\n';
            comment += '- ✅ Semantic HTML Tests\n';
            comment += '- ✅ WCAG 2.1 AA Accessibility Tests\n';
            comment += '- ✅ Performance & Keywords Tests\n\n';
            comment += '📊 [View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n';
            comment += '**Based on:**\n';
            comment += '- [WCAG 2.1 AA Guidelines](https://www.w3.org/WAI/WCAG21/quickref/)\n';
            comment += '- [Google SEO Starter Guide](https://developers.google.com/search/docs/fundamentals/seo-starter-guide)\n';
            comment += '- [Core Web Vitals](https://web.dev/articles/vitals)';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
