name: SEO & Accessibility Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least-privilege token: read the repo, comment the results on the PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  seo-accessibility-tests:
    name: Run SEO & Accessibility Tests
    runs-on: ubuntu-latest

    # Point Playwright at the preview server this job starts; with this set,
    # playwright.config.ts skips its own managed dev server. VITE_SITE_URL keeps
    # the built meta tags (canonical/OG) on the same origin as the test server.
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      VITE_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build application
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          echo "Preview server started with PID: $(cat /tmp/preview.pid)"
        env:
          CI: true

      - name: Wait for server to be ready
        run: |
          npx wait-on http://localhost:3000 --timeout 60000 || {
            echo "❌ Preview server failed to start within 60s";
            echo "📋 Server logs:";
            cat /tmp/preview.log;
            exit 1;
          }
          echo "✅ Preview server is ready at http://localhost:3000"
          curl -f http://localhost:3000 || {
            echo "❌ Health check failed";
            cat /tmp/preview.log;
            exit 1;
          }

      - name: Run SEO Metadata Tests
        id: metadata-tests
        run: npm run test:seo:metadata
        continue-on-error: true

      - name: Run Semantic HTML Tests
        id: semantic-tests
        run: npm run test:seo:semantic
        continue-on-error: true

      - name: Run Accessibility Tests
        id: accessibility-tests
        run: npm run test:seo:a11y
        continue-on-error: true

      - name: Run Performance & Keywords Tests
        id: performance-tests
        run: npm run test:seo:performance
        continue-on-error: true

      - name: Check if any test failed
        if: steps.metadata-tests.outcome == 'failure' || steps.semantic-tests.outcome == 'failure' || steps.accessibility-tests.outcome == 'failure' || steps.performance-tests.outcome == 'failure'
        run: |
          echo "❌ One or more test suites failed"
          exit 1

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('playwright-report/**/*') != ''
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('test-results/**/*') != ''
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Cleanup preview server
        if: always()
        run: |
          if [ -f /tmp/preview.pid ]; then
            kill $(cat /tmp/preview.pid) 2>/dev/null || true
            rm /tmp/preview.pid
          fi

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const metadataStatus = '${{ steps.metadata-tests.outcome }}' === 'success' ? '✅' : '❌';
            const semanticStatus = '${{ steps.semantic-tests.outcome }}' === 'success' ? '✅' : '❌';
            const accessibilityStatus = '${{ steps.accessibility-tests.outcome }}' === 'success' ? '✅' : '❌';
            const performanceStatus = '${{ steps.performance-tests.outcome }}' === 'success' ? '✅' : '❌';

            const allPassed = '${{ steps.metadata-tests.outcome }}' === 'success' && 
                              '${{ steps.semantic-tests.outcome }}' === 'success' && 
                              '${{ steps.accessibility-tests.outcome }}' === 'success' && 
                              '${{ steps.performance-tests.outcome }}' === 'success';

            const overallStatus = allPassed ? '✅ All tests passed!' : '❌ Some tests failed';

            let comment = `## 🔍 SEO & Accessibility Test Results\n\n`;
            comment += `### Overall Status: ${overallStatus}\n\n`;
            comment += `### Test Suites:\n`;
            comment += `${metadataStatus} **SEO Metadata Tests**\n`;
            comment += `${semanticStatus} **Semantic HTML Tests**\n`;
            comment += `${accessibilityStatus} **WCAG 2.1 AA Accessibility Tests** (powered by Axe-core)\n`;
            comment += `${performanceStatus} **Performance & Keywords Tests**\n\n`;

            if (!allPassed) {
              comment += `⚠️ **Action Required:** Review failed tests and fix violations before merging.\n\n`;
            }

            comment += `📊 [View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            comment += `📦 [Download Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n`;
            comment += `**Standards Validated:**\n`;
            comment += `- [WCAG 2.1 AA Guidelines](https://www.w3.org/WAI/WCAG21/quickref/) - 100+ automated rules\n`;
            comment += `- [Google SEO Starter Guide](https://developers.google.com/search/docs/fundamentals/seo-starter-guide)\n`;
            comment += `- [Core Web Vitals](https://web.dev/articles/vitals)\n`;
            comment += `- [HTML Living Standard](https://html.spec.whatwg.org/)\n\n`;
            comment += `🤖 Powered by Playwright + Axe-core`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
