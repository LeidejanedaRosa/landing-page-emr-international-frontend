name: CI/CD Pipeline

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Least-privilege default for every job. The one job that needs more (the
# Lighthouse PR comment) widens its own scope below.
permissions:
  contents: read

jobs:
  # ========================================
  # QUALIDADE & TESTES (Parallelized)
  # ========================================
  static-analysis:
    name: Static Analysis (Lint, Format, TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node Environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node Environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run unit tests
        run: npm run test:run

      - name: Run test coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # ========================================
  # BUILD & SECURITY
  # ========================================
  build:
    name: Build & Security Scan
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run pre-deploy validation
        run: npm run pre-deploy

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Run security audit (production dependencies only)
        # Only the production dependency tree ships in the bundle. Dev-tool
        # advisories are tracked separately (Dependabot / periodic `npm audit
        # fix`) rather than blocking every PR — and `npm audit fix --force`
        # would downgrade @lhci/cli to a broken 0.x.
        run: npm audit --omit=dev --audit-level high

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

      - name: Analyze bundle size
        run: |
          echo "## Bundle Size Analysis 📦" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|---------|" >> $GITHUB_STEP_SUMMARY
          find dist -name "*.js" -o -name "*.css" | while read file; do
            size=$(stat --printf="%s" "$file" | numfmt --to=iec)
            gzip_size=$(gzip -c "$file" | wc -c | numfmt --to=iec)
            echo "| $(basename $file) | $size | $gzip_size |" >> $GITHUB_STEP_SUMMARY
          done

  # ========================================
  # E2E TESTS
  # ========================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # ========================================
  # ACCESSIBILITY TESTS
  # ========================================
  accessibility:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Serve application
        run: |
          npx serve -s dist -p 3000 > /dev/null 2>&1 &
          SERVER_PID=$!
          sleep 5
          trap "kill $SERVER_PID" EXIT

      - name: Run axe accessibility tests
        run: |
          npx @axe-core/cli http://localhost:3000 --exit

  # ========================================
  # PERFORMANCE TESTS (STRICT - No continue-on-error)
  # ========================================
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: build
    # Widen only here: this job posts the Lighthouse results as a PR comment.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run Lighthouse CI (STRICT - Fails on regression)
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse Reports to GitHub Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ github.sha }}
          path: .lighthouseci/
          retention-days: 90
          if-no-files-found: warn

      - name: Comment PR with Lighthouse Results
        if: github.event_name == 'pull_request'
        # Informational only — a failed comment (e.g. fork PR with a read-only
        # token) must not fail the pipeline; the Lighthouse assertions above do.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read manifest to get report paths
            const manifestPath = '.lighthouseci/manifest.json';
            if (!fs.existsSync(manifestPath)) {
              console.log('No manifest found, skipping PR comment');
              return;
            }

            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const reports = manifest[0]?.summary || {};

            // Format scores as percentages
            const formatScore = (score) => score ? `${Math.round(score * 100)}%` : 'N/A';

            // Create comment body
            const body = `## 🚦 Lighthouse CI Results\n\n` +
              `| Category | Score |\n` +
              `|----------|-------|\n` +
              `| ⚡ Performance | ${formatScore(reports.performance)} |\n` +
              `| ♿ Accessibility | ${formatScore(reports.accessibility)} |\n` +
              `| 🏆 Best Practices | ${formatScore(reports['best-practices'])} |\n` +
              `| 🔍 SEO | ${formatScore(reports.seo)} |\n` +
              `| 📱 PWA | ${formatScore(reports.pwa)} |\n\n` +
              `📊 [View detailed reports in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ========================================
  # DEPLOYMENT
  # ========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests, build, e2e, accessibility]
    if: github.ref == 'refs/heads/beta'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying to staging environment..."
          # Aqui você adicionaria os comandos específicos do seu provedor de hosting
          # Exemplos: Vercel, Netlify, AWS S3, etc.

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests, build, e2e, accessibility, performance]
    if: github.ref == 'refs/heads/main'
    # environment: production  # Descomente após criar o environment no GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to production environment..."
          # Aqui você adicionaria os comandos específicos do seu provedor de hosting
          # Para releases, crie um workflow separado que seja acionado por tags

  # ========================================
  # NOTIFICATIONS
  # ========================================
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()

    steps:
      - name: Notify on success
        if: needs.deploy-production.result == 'success'
        run: |
          echo "✅ Deployment successful!"
          # Adicione aqui notificações para Slack, Discord, etc.

      - name: Notify on failure
        if: needs.deploy-production.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          # Adicione aqui notificações de falha
